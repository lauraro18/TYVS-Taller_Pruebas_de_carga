# Pruebas de rendimiento en CI.
#
#  - En cada pull request: baseline (20 VUs, 5 min) y carga corta 'load_pr'
#    (0->100 VUs, ~3 min). Si algun SLO no se cumple, k6 sale con codigo 99 y
#    el job falla: ese es el quality gate.
#  - On-demand (Actions > perf-tests > Run workflow): cualquier escenario,
#    incluidos los largos (load completo, stress, spike, soak).
#
# Los thresholds de perf/scripts/register_voter_k6.js son el gate:
#   http_req_failed < 1%, p95 < 300 ms, p99 < 800 ms, resultado de negocio incorrecto < 1%.

name: perf-tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      escenario:
        description: 'Escenario a ejecutar (todos = baseline, load y stress, sin y con pool, ~1 h)'
        required: true
        default: stress
        type: choice
        options: [baseline, load, stress, spike, soak, todos]
      variante:
        description: 'Variante del servicio'
        required: true
        default: con-pool
        type: choice
        options: [con-pool, sin-pool]

jobs:
  perf-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      # run_escenario.py levanta el servicio, espera /actuator/health, lo
      # calienta, corre k6 y guarda tambien las metricas del servidor.
      - name: Baseline (gate)
        run: python3 perf/run_escenario.py con-pool baseline

      - name: Carga corta (gate)
        if: always()
        run: python3 perf/run_escenario.py con-pool load_pr

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-pr
          path: |
            perf/results/con-pool/summary-*.json
            perf/results/con-pool/server-*.json
            perf/results/con-pool/timeline-*.csv
          if-no-files-found: warn

  perf-on-demand:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Necesario solo para versionar los resumenes de la bateria completa.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Escenario ${{ inputs.escenario }} (${{ inputs.variante }})
        if: inputs.escenario != 'todos'
        run: python3 perf/run_escenario.py ${{ inputs.variante }} ${{ inputs.escenario }}

      - name: Bateria completa antes/despues + tabla comparativa
        if: inputs.escenario == 'todos'
        run: |
          python3 perf/run_escenario.py todos
          python3 perf/comparar.py

      # Deja los resumenes versionados en el repositorio (evidencia reproducible).
      # Solo se agregan los archivos que permite .gitignore: summary, server y timeline.
      - name: Versionar resultados
        if: inputs.escenario == 'todos'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf/results
          git commit -m "Resultados de la bateria completa (run ${{ github.run_id }})" || echo "Sin cambios"
          git push

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ inputs.variante }}-${{ inputs.escenario }}
          path: |
            perf/results/*/summary-*.json
            perf/results/*/server-*.json
            perf/results/*/timeline-*.csv
            perf/results/*/*.log
            perf/results/comparacion.md
          if-no-files-found: warn
