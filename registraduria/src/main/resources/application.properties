# Puerto del servicio
server.port=8080

# Base de datos en memoria usada durante las pruebas de carga
registry.jdbc-url=jdbc:h2:mem:regdb;DB_CLOSE_DELAY=-1

# Pool de conexiones (HikariCP). 0 = sin pool (conexion nueva por operacion),
# util para reproducir la medicion "antes" con el mismo jar:
#   java -jar target/registraduria-1.0-SNAPSHOT.jar --registry.pool.max-size=0
registry.pool.max-size=20

# --- Observabilidad (Actuator + Micrometer) ---
# Se exponen solo los endpoints que el taller necesita.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# Percentiles de latencia por endpoint HTTP: permite comparar lo que mide k6
# desde el cliente con lo que mide el servidor. La diferencia entre ambos es
# tiempo de red y de encolamiento.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Resolucion del histograma del servidor: con el minimo por defecto (1 ms) casi
# todas las peticiones caen en el primer intervalo y el p95 del servidor no se
# puede estimar. 50 microsegundos da resolucion suficiente.
management.metrics.distribution.minimum-expected-value.http.server.requests=50us
